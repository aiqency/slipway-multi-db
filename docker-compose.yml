services:
  db:
    build: .
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: greetingdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d greetingdb"]
      interval: 5s
      retries: 10
